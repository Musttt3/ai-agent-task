<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("assets/Montserrat.ttf"); font-weight: 100 900; }
      :root { --ink: #ffffff; --accent: #ffd84a; --aqua: #3fe0d0; --glass: rgba(10, 22, 20, 0.42); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1080px; font-family: "Montserrat", sans-serif; }
      .clip { position: absolute; inset: 0; }
      /* mini player card */
      #player { position: absolute; left: 50%; bottom: 34px; width: 560px; height: 88px; margin-left: -280px;
        border-radius: 44px; background: var(--glass); border: 1.5px solid rgba(255,255,255,0.28);
        box-shadow: 0 10px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25); backdrop-filter: blur(14px); }
      #disc { position: absolute; left: 14px; top: 12px; width: 64px; height: 64px; border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, #ffd84a 0 9px, #111 10px 13px, #1b1b1b 14px 100%),
          repeating-radial-gradient(circle at 50% 50%, #000 0 2px, #2a2a2a 3px 4px);
        box-shadow: 0 0 0 2px rgba(255,255,255,0.15); }
      #disc::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 20deg, transparent 0 40deg, rgba(255,255,255,0.28) 55deg, transparent 75deg 220deg, rgba(255,255,255,0.18) 235deg, transparent 255deg); }
      #label { position: absolute; left: 92px; top: 17px; color: var(--ink); font-size: 15px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.9; }
      #sub { position: absolute; left: 92px; top: 40px; color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 500; letter-spacing: 0.08em; }
      #eq { position: absolute; right: 26px; top: 18px; height: 52px; width: 190px; display: flex; align-items: flex-end; gap: 6px; }
      .bar { width: 10px; height: 52px; border-radius: 5px; background: linear-gradient(to top, var(--aqua), var(--accent)); transform-origin: 50% 100%; transform: scaleY(0.15); }
      #track { position: absolute; left: 92px; right: 240px; bottom: 16px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25); overflow: hidden; }
      #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); }
      .spark { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; opacity: 0; transform: scale(0); }
      .spark svg { width: 100%; height: 100%; filter: drop-shadow(0 0 8px rgba(255,240,180,0.9)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.783" data-width="1080" data-height="1080">
      <div id="overlay" class="clip" data-start="0" data-duration="25.783" data-track-index="0">
        <div id="sparks"></div>
        <div id="player">
          <div id="disc"></div>
          <div id="label">now playing</div>
          <div id="sub">waterfall mood &#9834;</div>
          <div id="track"><div id="fill"></div></div>
          <div id="eq"></div>
        </div>
      </div>
    </div>
    <script>
      const DUR = 25.783;
      const KICKS = [0.267, 0.94, 1.591, 2.252, 2.902, 3.587, 5.875, 7.21, 8.522, 9.857, 11.157, 12.481, 13.804, 15.128, 16.126, 16.776, 17.763, 19.087, 20.399, 21.722, 23.034, 24.358];
      const HATS = [0.255, 0.604, 0.917, 1.254, 1.579, 1.916, 2.229, 2.566, 2.902, 3.228, 3.564, 3.889, 4.226, 4.551, 5.875, 6.2, 6.536, 6.861, 7.187, 7.523, 7.86, 8.173, 8.847, 9.172, 9.497, 9.834, 10.159, 10.495, 10.82, 11.157, 11.482, 11.807, 12.144, 12.469, 12.806, 13.131, 13.456, 13.793, 14.118, 14.454, 14.78, 15.116, 15.441, 15.778, 16.103, 16.765, 17.09, 17.415, 17.74, 18.077, 18.413, 18.739, 19.075, 19.4, 19.737, 20.225, 20.561, 21.049, 21.374, 21.711, 22.047, 22.372, 22.698, 23.034, 23.359, 23.696, 24.184, 24.683, 25.008, 25.345];
      const LEVEL = [0.063, 0.137, 0.435, 0.514, 0.614, 0.675, 0.869, 0.515, 0.476, 0.968, 0.69, 0.432, 0.698, 0.591, 0.451, 0.636, 0.802, 0.76, 0.585, 0.894, 0.689, 0.633, 1.0, 0.865, 0.534, 0.73, 0.787, 0.375, 0.432, 0.749, 0.811, 0.762, 0.883, 0.663, 0.434, 0.884, 0.896, 0.464, 0.671, 0.714, 0.468, 0.425, 0.565, 0.544, 0.518, 0.779, 0.779, 0.751, 0.488, 0.462, 0.437, 0.465, 0.609, 0.538, 0.509, 0.473, 0.5, 0.471, 0.903, 0.949, 0.491, 0.623, 0.892, 0.569, 0.432, 0.712, 0.63, 0.479, 0.68, 0.668, 0.75, 0.765, 0.958, 0.724, 0.548, 0.878, 0.6, 0.486, 0.697, 0.538, 0.324, 0.438, 0.47, 0.707, 0.637, 0.929, 0.667, 0.561, 0.966, 0.868, 0.721, 0.688, 0.698, 0.489, 0.518, 0.555, 0.746, 0.728, 0.818, 0.698, 0.68, 0.898, 0.846, 0.565, 0.677, 0.724, 0.305, 0.288, 0.385, 0.681, 0.714, 0.889, 0.786, 0.464, 0.799, 0.874, 0.588, 0.535, 0.71, 0.545, 0.491, 0.707, 0.703, 0.752, 0.898, 0.909, 0.754, 0.662, 0.976, 0.619, 0.551, 0.735, 0.48, 0.465, 0.575, 0.551, 0.676, 0.882, 0.937, 0.713, 0.549, 0.911, 0.609, 0.451, 0.591, 0.471, 0.208, 0.429, 0.5, 0.621, 0.66, 0.973, 0.696, 0.685, 0.882, 0.713, 0.426, 0.773, 0.794, 0.599, 0.494, 0.769, 0.744, 0.712, 0.946, 0.688, 0.391, 0.839, 0.792, 0.623, 0.637, 0.726, 0.532, 0.399, 0.759, 0.677, 0.717, 0.887, 0.814, 0.724, 0.881, 0.953, 0.535, 0.626, 0.699, 0.485, 0.588, 0.614, 0.689, 0.714, 0.89, 0.906, 0.794, 0.711, 0.914, 0.489, 0.523, 0.666, 0.438, 0.396, 0.501, 0.568, 0.708, 0.743, 0.924, 0.75, 0.639, 0.891, 0.683, 0.519, 0.721, 0.565, 0.354, 0.488, 0.56, 0.734, 0.615, 0.961, 0.604, 0.591, 0.876, 0.734, 0.616, 0.691, 0.713, 0.506, 0.539, 0.686, 0.81, 0.821, 0.904, 0.758, 0.755, 0.928, 0.91, 0.547, 0.723, 0.74, 0.474, 0.523, 0.471, 0.701, 0.748, 0.908, 0.787, 0.631, 0.888, 0.954, 0.654, 0.635, 0.696, 0.492, 0.483, 0.568, 0.524, 0.415, 0.185, 0.092]; // loudness every 0.1 s
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // deterministic pseudo-random
      let seed = 7; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

      // player card slides up at the start
      tl.fromTo("#player", { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.15);
      // disc spin + progress
      tl.fromTo("#disc", { rotation: 0 }, { rotation: 360 * DUR / 2.2, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#fill", { scaleX: 0 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);
      tl.to("#player", { y: 140, opacity: 0, duration: 0.45, ease: "power2.in" }, DUR - 0.6);

      // equalizer: 14 bars; low bars hit on kicks, high bars on hats, all ride the loudness
      const eq = document.getElementById("eq");
      const N = 14;
      for (let i = 0; i < N; i++) {
        const b = document.createElement("div"); b.className = "bar"; b.id = "bar" + i; eq.appendChild(b);
      }
      for (let i = 0; i < N; i++) {
        const sel = "#bar" + i;
        const low = i < 5, w = 0.55 + 0.45 * Math.sin(i * 1.7) ** 2;
        const cues = (low ? KICKS : HATS).filter((c) => c < DUR - 0.2);
        cues.forEach((c, k) => {
          const lv = LEVEL[Math.min(LEVEL.length - 1, Math.round(c * 10))] || 0.5;
          const peak = Math.min(1, (low ? 0.75 : 0.45) + 0.5 * lv * w + 0.25 * rnd());
          tl.to(sel, { scaleY: peak, duration: 0.05, ease: "power2.out" }, c);
          tl.to(sel, { scaleY: 0.12 + 0.2 * lv * w, duration: low ? 0.45 : 0.25, ease: "power2.in" }, c + 0.05);
        });
      }

      // sparkles flash on kicks around the frame edges (kept off the centre)
      const sp = document.getElementById("sparks");
      const star = '<svg viewBox="-50 -50 100 100"><path d="M0,-48 C6,-8 8,-6 48,0 C8,6 6,8 0,48 C-6,8 -8,6 -48,0 C-8,-6 -6,-8 0,-48Z" fill="#fff8d8"/></svg>';
      KICKS.filter((c) => c < DUR - 0.5).forEach((c, k) => {
        for (let j = 0; j < 2; j++) {
          const s = document.createElement("div"); s.className = "spark"; s.id = `sp${k}_${j}`; s.innerHTML = star;
          const side = rnd();
          let x, y;
          if (side < 0.5) { x = 60 + rnd() * 960; y = 50 + rnd() * 120; } else { x = rnd() < 0.5 ? 50 + rnd() * 110 : 920 + rnd() * 110; y = 160 + rnd() * 620; }
          s.style.left = x + "px"; s.style.top = y + "px"; sp.appendChild(s);
          const sz = 0.5 + rnd() * 0.8, t0 = c + j * 0.06;
          tl.fromTo(s, { scale: 0, opacity: 0, rotation: -40 }, { scale: sz, opacity: 1, rotation: 20, duration: 0.14, ease: "back.out(3)" }, t0);
          tl.to(s, { scale: 0, opacity: 0, rotation: 60, duration: 0.4, ease: "power2.in" }, t0 + 0.16);
        }
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
