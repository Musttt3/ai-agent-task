  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Shared per-beat build: card grows from the floor, the person rises out of it,
      // the Indonesian label and counter land last.
      function body(i, b) {
        tl.fromTo(`#m-c${i}`, { scaleY: 0 }, { scaleY: 1, duration: 0.38, ease: "expo.out" }, b + 0.04);
        tl.fromTo(
          `#m-p${i}`,
          { y: 160, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "expo.out" },
          b + 0.14,
        );
        tl.fromTo(
          `#m-l${i}`,
          { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" },
          b + 0.5,
        );
        tl.fromTo(`#m-n${i}`, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power4.out" }, b + 0.58);
      }

      // Colour flood: the new ground opens as a circle from the card.
      function flood(i, b) {
        tl.fromTo(
          `#m-g${i}`,
          { clipPath: "circle(0% at 50% 78%)" },
          { clipPath: "circle(150% at 50% 78%)", duration: 0.4, ease: "power2.inOut" },
          b,
        );
      }

      // 01 THINK — letters one by one, light to full.
      tl.fromTo(
        "#m-w0 span",
        { opacity: 0.25, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.07 },
        0.06,
      );
      body(0, 0);

      // 02 WRITE — whole line blurs in.
      flood(1, 2);
      tl.fromTo(
        "#m-w1",
        { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
        2.12,
      );
      body(1, 2);

      // 03 BUILD — whip in from the left.
      flood(2, 4);
      tl.fromTo(
        "#m-w2",
        { x: -520, filter: "blur(14px)" },
        { x: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" },
        4.06,
      );
      body(2, 4);

      // 04 SHARE — letters rise from below the baseline.
      flood(3, 6);
      tl.fromTo(
        "#m-w3 span",
        { y: 260, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "expo.out", stagger: 0.05 },
        6.08,
      );
      body(3, 6);

      window.__timelines = window.__timelines || {};
      window.__timelines["manifesto"] = tl;
    })();
  </script>
