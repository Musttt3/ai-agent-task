<!doctype html>
<html
  lang="en"
  data-composition-variables='[
  {"id":"name","type":"string","label":"Name","default":"MUSTTT"},
  {"id":"color-ground","type":"color","label":"Background","default":"#0A0A0B"},
  {"id":"color-ink","type":"color","label":"Text","default":"#F4F1EC"},
  {"id":"color-accent","type":"color","label":"Accent","default":"#C8102E"}
]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #0a0a0b;
        --color-ink: #f4f1ec;
        --color-accent: #c8102e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      Two 2D scenes for the MUSTTT motion graphic. The Remotion project
      (../musttt-remotion) renders the 3D scenes and cuts these in:
        manifesto  0s – 8s   -> master 6s – 14s
        hero       8s – 13s  -> master 21s – 26s
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="manifesto"
        data-composition-id="manifesto"
        data-composition-src="compositions/manifesto.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="hero"
        data-composition-id="hero"
        data-composition-src="compositions/hero.html"
        data-start="8"
        data-duration="5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
